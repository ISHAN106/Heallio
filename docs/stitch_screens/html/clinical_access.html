<div class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="absolute top-0 right-0 w-full h-[60vh] bg-secondary-container/10 blur-[100px] rounded-full translate-x-1/4 -translate-y-1/4 mix-blend-screen"></div>
</div>
<!-- Header -->
<div class="flex flex-col items-center justify-center gap-6 mt-12 z-10 px-container-padding text-center">
<img alt="Heallio Brand Mark" class="w-20 h-20 rounded-2xl shadow-[0_20px_40px_rgba(0,0,0,0.5)]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDV38zSsx4lJlZb-ByIgPEIkInjhdwPa2HcEFRq2DUQQr-cu_H_sna1CIMbeBxQZU_DsKF6p2huhAe4IplaafWmRo7lTR6ApaFMH9wEFLxqaNdbS6drrt0Ergqpul1v5773WkFo28pemPdX9kmp31mC9yVPtbrOh9jN9hT-I88WNvzoY8A_E7cwBBvNqmFSVlB4rLRYUJkDzz-37kE1AnoK3ePeVqf0qlEtqVJh2mlwS6x91G2f-9Q0wQ"/>
<div>
<h1 class="font-headline-md text-headline-md text-on-surface">Provider Portal</h1>
<p class="font-body-md text-body-md text-secondary mt-2">Secure Clinical Access</p>
</div>
</div>
<!-- Glass Form Container -->
<div class="z-10 mx-container-padding mt-8 bg-[#1b1e24]/55 backdrop-blur-[24px] rounded-[32px] p-6 shadow-[inset_1px_1px_0_rgba(255,255,255,0.1),0_20px_40px_rgba(0,0,0,0.4)] flex flex-col gap-6 transition-all duration-300 hover:bg-[#1b1e24]/65">
<!-- Input Wells -->
<div class="flex flex-col gap-4">
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">badge</span>
<input class="w-full bg-black/20 rounded-2xl pl-12 pr-4 py-4 font-metric-sm text-metric-sm text-on-surface placeholder:text-on-surface-variant shadow-[inset_1px_1px_0_rgba(255,255,255,0.05)] focus:outline-none focus:bg-black/40 transition-colors" placeholder="NPI Number" type="text"/>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">fingerprint</span>
<input class="w-full bg-black/20 rounded-2xl pl-12 pr-4 py-4 font-metric-sm text-metric-sm text-on-surface placeholder:text-on-surface-variant shadow-[inset_1px_1px_0_rgba(255,255,255,0.05)] focus:outline-none focus:bg-black/40 transition-colors" placeholder="Passcode" type="password"/>
</div>
</div>
<!-- Attestation Checkbox (Full-width tap area) -->
<label class="flex items-start gap-4 p-4 -mx-4 rounded-2xl active:bg-white/5 transition-colors cursor-pointer group">
<div class="relative flex items-center justify-center w-6 h-6 rounded bg-black/20 shadow-[inset_1px_1px_0_rgba(255,255,255,0.05)] flex-shrink-0 mt-0.5 group-hover:bg-black/30 transition-colors">
<input class="peer opacity-0 absolute inset-0 w-full h-full cursor-pointer" type="checkbox"/>
<span class="material-symbols-outlined text-[16px] text-secondary opacity-0 scale-50 peer-checked:opacity-100 peer-checked:scale-100 transition-all duration-200" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant select-none">
        I attest that I am an authorized medical professional accessing protected health information (PHI) under HIPAA guidelines.
      </p>
</label>
<!-- Clinical Gold Button -->
<button class="w-full bg-secondary text-on-secondary font-label text-label uppercase tracking-widest py-5 rounded-2xl shadow-[0_8px_24px_rgba(243,190,101,0.25)] active:scale-[0.98] transition-transform flex justify-center items-center gap-2">
      Authenticate
      <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
<!-- Mode Toggle -->
<div class="flex justify-center mt-12 mb-8 z-10 w-full px-container-padding">
<div class="inline-flex bg-[#1b1e24]/55 backdrop-blur-[24px] shadow-[inset_1px_1px_0_rgba(255,255,255,0.1),0_10px_20px_rgba(0,0,0,0.4)] rounded-full p-1.5 w-full max-w-xs relative">

<span class="material-symbols-outlined text-[18px]">stethoscope</span>
        Doctor

</div>
</div>

<div class="flex justify-center gap-2 pb-8 z-10">
<div class="w-1.5 h-1.5 rounded-full bg-secondary opacity-100"></div>
<div class="w-1.5 h-1.5 rounded-full bg-on-surface-variant opacity-30"></div>
<div class="w-1.5 h-1.5 rounded-full bg-on-surface-variant opacity-30"></div>
</div>

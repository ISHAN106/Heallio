t:"500"}],"headline-md":["32px",{lineHeight:"1.2",letterSpacing:"-0.02em",fontWeight:"700"}],label:["12px",{lineHeight:"1",letterSpacing:"0.05em",fontWeight:"600"}],"body-lg":["15px",{lineHeight:"1.6",letterSpacing:"0",fontWeight:"400"}],"metric-lg":["28px",{lineHeight:"1",letterSpacing:"-0.02em",fontWeight:"500"}],"body-md":["13px",{lineHeight:"1.5",letterSpacing:"0",fontWeight:"400"}],"headline-sm":["24px",{lineHeight:"1.2",letterSpacing:"-0.02em",fontWeight:"700"}],"display-lg-mobile":["40px",{lineHeight:"1.1",letterSpacing:"-0.04em",fontWeight:"700"}]}}}}</script><style>@layer base{body{background-color:#0d0e12;}.pt-safe{padding-top:env(safe-area-inset-top,0px);}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}}</style></head><body class="bg-surface-container-lowest font-body-md text-on-surface"><main class="relative w-full min-h-screen pt-safe pb-safe"><div class="flex flex-col w-full px-container-padding pb-safe overflow-hidden" id="role-choice-container">
<!-- Centered Logo -->
<div class="w-full flex justify-center mt-12 mb-16 opacity-0 translate-y-4" id="anim-logo">
<div class="relative w-20 h-20 rounded-full overflow-hidden shadow-[inset_1px_1px_0_rgba(255,255,255,0.2)] bg-[rgba(27,30,36,0.55)] backdrop-blur-[24px]">
<img alt="Heallio Brand Mark" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDV38zSsx4lJlZb-ByIgPEIkInjhdwPa2HcEFRq2DUQQr-cu_H_sna1CIMbeBxQZU_DsKF6p2huhAe4IplaafWmRo7lTR6ApaFMH9wEFLxqaNdbS6drrt0Ergqpul1v5773WkFo28pemPdX9kmp31mC9yVPtbrOh9jN9hT-I88WNvzoY8A_E7cwBBvNqmFSVlB4rLRYUJkDzz-37kE1AnoK3ePeVqf0qlEtqVJh2mlwS6x91G2f-9Q0wQ"/>
</div>
</div>
<!-- Asymmetric Header -->
<div class="flex flex-col mb-12 opacity-0 translate-y-4 pr-12" id="anim-header">
<h1 class="font-headline-md text-on-surface mb-2">Initialize Profile</h1>
<p class="font-body-lg text-on-surface-variant">Select your operational environment to calibrate the interface.</p>
</div>
<!-- Role Cards -->
<div class="flex flex-col gap-6">
<!-- Patient Card -->
<button class="role-card group relative w-full flex flex-col items-start text-left p-6 rounded-xl bg-[rgba(27,30,36,0.55)] backdrop-blur-[24px] shadow-[inset_1px_1px_0_rgba(255,255,255,0.1)] hover:bg-[rgba(27,30,36,0.65)] hover:shadow-[inset_1px_1px_0_rgba(255,255,255,0.25)] transition-all duration-300 opacity-0 translate-y-8" id="anim-card-1">
<div class="absolute inset-0 rounded-xl bg-gradient-to-br from-primary/5 to-transparent pointer-events-none"></div>
<div class="w-12 h-12 rounded-lg bg-[rgba(0,0,0,0.2)] shadow-[inset_1px_1px_0_rgba(255,255,255,0.1)] flex items-center justify-center mb-6 text-primary group-hover:scale-110 transition-transform duration-500 ease-out">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">personal_injury</span>
</div>
<h2 class="font-headline-sm text-on-surface mb-1">Patient Access</h2>
<p class="font-body-md text-on-surface-variant mb-6">Monitor live vitals, review encrypted clinical data, and initiate telehealth modules.</p>
<div class="inline-flex items-center gap-2 font-metric-sm text-primary uppercase tracking-widest mt-auto">
<span>Select Protocol</span>
<span class="material-symbols-outlined text-sm transition-transform group-hover:translate-x-1">arrow_forward</span>
</div>
</button>
<!-- Doctor Card -->
<button class="role-card group relative w-full flex flex-col items-start text-left p-6 rounded-xl bg-[rgba(27,30,36,0.55)] backdrop-blur-[24px] shadow-[inset_1px_1px_0_rgba(255,255,255,0.1)] hover:bg-[rgba(27,30,36,0.65)] hover:shadow-[inset_1px_1px_0_rgba(255,255,255,0.25)] transition-all duration-300 opacity-0 translate-y-8" id="anim-card-2">
<div class="absolute inset-0 rounded-xl bg-gradient-to-br from-secondary/5 to-transparent pointer-events-none"></div>
<div class="w-12 h-12 rounded-lg bg-[rgba(0,0,0,0.2)] shadow-[inset_1px_1px_0_rgba(255,255,255,0.1)] flex items-center justify-center mb-6 text-secondary group-hover:scale-110 transition-transform duration-500 ease-out">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">stethoscope</span>
</div>
<h2 class="font-headline-sm text-on-surface mb-1">Clinical Authority</h2>
<p class="font-body-md text-on-surface-variant mb-6">Manage patient telemetry, analyze longitudinal charts, and authorize protocols.</p>
<div class="inline-flex items-center gap-2 font-metric-sm text-secondary uppercase tracking-widest mt-auto">
<span>Select Protocol</span>
<span class="material-symbols-outlined text-sm transition-transform group-hover:translate-x-1">arrow_forward</span>
</div>
</button>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const elements = [
            document.getElementById('anim-logo'),
            document.getElementById('anim-header'),
            document.getElementById('anim-card-1'),
            document.getElementById('anim-card-2')
        ];

        elements.forEach((el, index) => {
            if (!el) return;
            setTimeout(() => {
                el.style.transition = 'all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.1)';
                el.style.opacity = '1';
                el.style.transform = 'translateY(0)';
            }, 100 + (index * 150));
        });

        // Interactive ripple effect on cards
        document.querySelectorAll('.role-card').forEach(card => {
            card.addEventListener('click', function(e) {
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const ripple = document.createElement('div');
                ripple.style.position = 'absolute';
                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                ripple.style.width = '2px';
                ripple.style.height = '2px';
                ripple.style.background = 'rgba(255,255,255,0.3)';
                ripple.style.borderRadius = '50%';
                ripple.style.transform = 'scale(1)';
                ripple.style.transition = 'all 0.6s ease-out';
                ripple.style.pointerEvents = 'none';
                
                this.appendChild(ripple);
                
                requestAnimationFrame(() => {
                    ripple.style.transform = 'scale(200)';
                    ripple.style.opacity = '0';
                });
                
                setTimeout(() => ripple.remove(), 600);
            });
        });
    });
</script></main></body></html>

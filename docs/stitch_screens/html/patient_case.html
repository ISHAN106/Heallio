</div>
<div class="px-container-padding pb-section-gap flex flex-col gap-section-gap pt-6 relative z-10">

<div class="bg-error/10 rounded-xl p-4 flex items-center justify-between border-t border-l border-white/10 backdrop-blur-[24px]">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">warning</span>
<span class="font-metric-sm text-error uppercase tracking-widest">Elevated Risk</span>
</div>
<span class="font-metric-sm text-error/70">Severity: High</span>
</div>
<div class="flex flex-col gap-2 relative">

</div>
<div class="bg-surface-container-high/50 px-3 py-1.5 rounded-full border-t border-l border-white/5 backdrop-blur-md inline-flex items-center gap-2">
<span class="font-metric-sm text-on-surface-variant">ID: 884-VX-9</span>
</div>
</div>
</div>
</div>
<!-- Primary Action: Open Chat -->
<div class="w-full flex justify-end animate-fade-in-up" style="animation-delay: 0.2s;">
<button class="w-3/4 sm:w-auto bg-secondary-container text-on-secondary-container font-label text-metric-sm px-6 py-4 rounded-xl flex items-center justify-center gap-3 hover:bg-secondary-container/90 transition-all shadow-lg active:scale-95 group relative overflow-hidden">
<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>

<div class="absolute top-0 right-0 w-2 h-2 bg-secondary rounded-full animate-pulse mr-4 mt-4"></div>
</button>
</div>

<div class="flex flex-col gap-4 animate-fade-in-up" style="animation-delay: 0.3s;">
<div class="flex justify-between items-end mb-2 px-2">
<h3 class="font-label text-on-surface-variant uppercase tracking-widest text-xs">Current Telemetry</h3>
</div>
<div class="flex flex-col gap-3">
<!-- Vitals Card Left -->

</div>
<div class="w-16 h-8 opacity-70 group-hover:opacity-100 transition-opacity">

</div>
</div>
</div>

</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label text-on-surface-variant text-[10px] uppercase pl-2">Dosage Instructions</label>

<div class="bg-black/20 rounded-xl border-t border-l border-white/5 p-4 focus-within:bg-black/30 transition-colors">

</div>
</div>
<button class="w-full bg-primary text-on-primary font-label text-metric-sm px-6 py-4 rounded-xl flex items-center justify-center gap-2 hover:bg-primary/90 transition-all mt-2">
<span class="material-symbols-outlined">fingerprint</span>
                Authorize Script
            </button>
</div>
</div>

<div class="flex flex-col items-center justify-center gap-4 mt-8 py-8 animate-fade-in-up" style="animation-delay: 0.5s;">

<div class="flex gap-2">

<button class="text-surface-variant hover:scale-110 transition-transform"><span class="material-symbols-outlined text-3xl">star</span></button>
</div>
<span class="font-metric-sm text-secondary">3.5 / 5.0 - Requires Monitoring</span>
</div>
</div>
</div>

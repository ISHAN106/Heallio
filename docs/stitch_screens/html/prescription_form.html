<script>
  document.addEventListener('DOMContentLoaded', () => {
    const list = document.getElementById('medication-list');
    const addBtn = document.getElementById('add-med-btn');

    // Handle initial remove buttons
    document.querySelectorAll('.remove-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const row = e.target.closest('.med-row');
        if (document.querySelectorAll('.med-row').length > 1) {
          row.style.opacity = '0';
          row.style.transform = 'scale(0.95)';
          setTimeout(() => row.remove(), 300);
        }
      });
    });

    // Add new medication row
    addBtn.addEventListener('click', () => {
      const newRow = document.createElement('div');
      newRow.className = 'med-row flex flex-col gap-3 relative group opacity-0 scale-95 transition-all duration-300';
      newRow.innerHTML = `
        <div class="h-px w-full bg-white/5 mb-2"></div>
        <div class="flex gap-3">
          <div class="flex-1 flex flex-col gap-1">
            <label class="font-label text-label text-on-surface-variant">Medication Name</label>
            <input type="text" class="w-full bg-black/30 frost-edge rounded-xl p-4 font-metric-sm text-on-surface placeholder:text-outline focus:outline-none focus:bg-black/40 transition-colors shadow-inner" placeholder="Enter name...">
          </div>
          <div class="w-1/3 flex flex-col gap-1">
            <label class="font-label text-label text-on-surface-variant">Dosage</label>
            <input type="text" class="w-full bg-black/30 frost-edge rounded-xl p-4 font-metric-sm text-on-surface placeholder:text-outline focus:outline-none focus:bg-black/40 transition-colors shadow-inner text-right" placeholder="0mg">
          </div>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-error text-label font-label opacity-0 transition-opacity validation-msg">Required</span>
          <button class="remove-btn flex items-center gap-1 text-error-container bg-error-container/10 px-3 py-1.5 rounded-lg active:scale-95 transition-all">
            <span class="material-symbols-outlined text-[16px]">close</span>
            <span class="font-label text-label">Remove</span>
          </button>
        </div>
      `;
      
      list.appendChild(newRow);
      
      // Trigger animation
      requestAnimationFrame(() => {
        newRow.classList.remove('opacity-0', 'scale-95');
      });

      // Bind remove event
      newRow.querySelector('.remove-btn').addEventListener('click', (e) => {
        const row = e.target.closest('.med-row');
        if (document.querySelectorAll('.med-row').length > 1) {
          row.classList.add('opacity-0', 'scale-95');
          setTimeout(() => row.remove(), 300);
        }
      });
    });
  });
